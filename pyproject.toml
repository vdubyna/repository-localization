[project]
name = "repository-localization"
version = "0.1.0"
description = "Versioned Codex localization experiment pipeline."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.10,<4",
    "tiktoken==0.13.0",
]

[project.scripts]
repository-localization = "repository_localization.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".local", ".venv"]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
